<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CardMania - Rick and Morty</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #333;
            color: white;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        header img {
            height: 40px;
        }

        nav {
            margin-top: 1rem;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 1rem;
            font-weight: bold;
        }

        main {
            flex: 1;
            padding: 1rem;
        }

        section {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
        }

        .card {
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: scale(1.03);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-content {
            padding: 1rem;
        }

        .card-content h3 {
            margin-top: 0;
            font-size: 1.2rem;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<header>
    <div style="display: flex; align-items: center;">
        <span style="margin-left: 10px; font-size: 1.5rem;">CardMania</span>
    </div>
    <nav>
        <a href="#">Home</a>
        <a href="#">Characters</a>
        <a href="#">Episodes</a>
    </nav>
</header>

<main>
    <section>
        <h2>Personagens Rick & Morty</h2>
        <div class="card-grid" id="cardGrid"></div>
    </section>
</main>

<footer>
    <p>&copy; 2025 CardMania - Todos os direitos reservados.</p>
</footer>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const cardGrid = document.getElementById('cardGrid');

        fetch('https://rickandmortyapi.com/api/character')
            .then(response => response.json())
            .then(data => {
                const characters = data.results.slice(0, 8); // Pegando os primeiros 8 personagens

                characters.forEach(char => {
                    const card = document.createElement('div');
                    card.className = 'card';

                    card.innerHTML = `
                        <img src="${char.image}" alt="${char.name}">
                        <div class="card-content">
                            <h3>${char.name}</h3>
                            <p>Status: ${char.status}</p>
                            <p>Espécie: ${char.species}</p>
                        </div>
                    `;

                    cardGrid.appendChild(card);
                });
            })
            .catch(error => {
                console.error('Erro ao carregar os dados:', error);
                cardGrid.innerHTML = '<p>Não foi possível carregar os personagens.</p>';
            });
    });
</script>

</body>
</html>
